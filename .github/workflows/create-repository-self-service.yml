name: Create Repository Self-Service

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: github.event_name == 'issues' && contains(github.event.issue.body, 'Technology')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue form inputs
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            function extractField(label) {
              const pattern = new RegExp(`###\\s+${label}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`);
              const match = body.match(pattern);

              if (!match) {
                throw new Error(`Missing issue form field: ${label}`);
              }

              return match[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();
            }

            const technologyInput = extractField('Technology');
            const password = extractField('Access Key:');
            const technology = technologyInput.toLowerCase();
            const supportedTechnologies = new Set(['docker', 'maven']);

            if (!supportedTechnologies.has(technology)) {
              throw new Error(`Unsupported technology: ${technologyInput}`);
            }

            const issueAuthor = context.payload.issue.user.login;
            const repositoryName = `devopsdays.demo.${issueAuthor}`;
            const templateRepositoryName = `template.${technology}`;

            core.setOutput('technology', technology);
            core.setOutput('technology_label', technologyInput);
            core.setOutput('repository_name', repositoryName);
            core.setOutput('issue_author', issueAuthor);
            core.setOutput('template_repository_name', templateRepositoryName);
            core.setOutput('password', password);

      - name: Notify issue - in progress
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "⏳ Creating repository... [View workflow run](${RUN_URL})"

      - name: Verify password
        env:
          INPUT_PASSWORD: ${{ steps.parse.outputs.password }}
          DEVOPSDAYS_SECRET: ${{ secrets.DEVOPSDAYS_SECRET }}
        run: |
          set -euo pipefail
          if [ "${INPUT_PASSWORD,,}" != "${DEVOPSDAYS_SECRET,,}" ]; then
            echo "::error::Invalid password."
            exit 1
          fi

      - name: Verify automation token
        env:
          GH_TOKEN: ${{ secrets.SELF_SERVICE_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Missing SELF_SERVICE_GH_TOKEN secret."
            exit 1
          fi

      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ steps.parse.outputs.template_repository_name }}
          path: template-repository
          token: ${{ secrets.SELF_SERVICE_GH_TOKEN }}

      - name: Create repository from template code
        id: create_repository
        env:
          GH_TOKEN: ${{ secrets.SELF_SERVICE_GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ steps.parse.outputs.repository_name }}
          TEMPLATE_REPOSITORY_NAME: ${{ steps.parse.outputs.template_repository_name }}
        run: |
          set -euo pipefail

          if gh repo view "${OWNER}/${REPOSITORY_NAME}" >/dev/null 2>&1; then
            echo "::error::Repository ${OWNER}/${REPOSITORY_NAME} already exists."
            exit 1
          fi

          cd template-repository
          rm -rf .git
          git init --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: Initial commit from ${OWNER}/${TEMPLATE_REPOSITORY_NAME}"
          gh repo create "${OWNER}/${REPOSITORY_NAME}" --public --source=. --remote=origin --push

          repository_url="$(gh repo view "${OWNER}/${REPOSITORY_NAME}" --json url -q .url)"
          echo "repository_url=${repository_url}" >> "${GITHUB_OUTPUT}"

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPOSITORY_NAME}/actions/permissions" \
            -f enabled=true \
            -f allowed_actions=all

      - name: Add issue author as collaborator
        env:
          GH_TOKEN: ${{ secrets.SELF_SERVICE_GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ steps.parse.outputs.repository_name }}
          ISSUE_AUTHOR: ${{ steps.parse.outputs.issue_author }}
        run: |
          set -euo pipefail
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPOSITORY_NAME}/collaborators/${ISSUE_AUTHOR}" \
            -f permission=push

      - name: Write workflow summary
        env:
          TECHNOLOGY: ${{ steps.parse.outputs.technology_label }}
          REPOSITORY_NAME: ${{ steps.parse.outputs.repository_name }}
          REPOSITORY_URL: ${{ steps.create_repository.outputs.repository_url }}
        run: |
          {
            echo "## Repository created"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | [${REPOSITORY_NAME}](${REPOSITORY_URL}) |"
            echo "| Technology | ${TECHNOLOGY} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify issue - completed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ steps.create_repository.outputs.repository_url }}
          REPOSITORY_NAME: ${{ steps.parse.outputs.repository_name }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "✅ Repository created: [${REPOSITORY_NAME}](${REPOSITORY_URL})"
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --reason completed
