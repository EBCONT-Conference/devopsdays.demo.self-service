name: Add External Contributor

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  add-external-contributor:
    if: github.event_name == 'issues' && contains(github.event.issue.body, 'Email Address')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue form inputs
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            function extractField(label) {
              const pattern = new RegExp(`###\\s+${label}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`);
              const match = body.match(pattern);

              if (!match) {
                throw new Error(`Missing issue form field: ${label}`);
              }

              return match[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();
            }

            const email = extractField('Email Address');

            if (!email || !email.includes('@')) {
              throw new Error(`Invalid email address: ${email}`);
            }

            core.setOutput('email', email);

      - name: Notify issue - in progress
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "⏳ Adding you to the organization as an external contributor... [View workflow run](${RUN_URL})"

      - name: Verify automation token
        env:
          GH_TOKEN: ${{ secrets.SELF_SERVICE_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Missing SELF_SERVICE_GH_TOKEN secret."
            exit 1
          fi

      - name: Add user to organization as outside collaborator
        env:
          GH_TOKEN: ${{ secrets.SELF_SERVICE_GH_TOKEN }}
          ORG: ${{ github.repository_owner }}
          EMAIL: ${{ steps.parse.outputs.email }}
        run: |
          set -euo pipefail

          # Look up the GitHub username by email
          USERNAME="$(gh api /search/users?q="${EMAIL}+in:email" --jq '.items[0].login // empty')"

          if [ -z "${USERNAME}" ]; then
            echo "::error::No GitHub user found for email: ${EMAIL}"
            exit 1
          fi

          echo "username=${USERNAME}" >> "${GITHUB_ENV}"

          # Check if the user is already an outside collaborator
          if gh api "/orgs/${ORG}/outside_collaborators/${USERNAME}" >/dev/null 2>&1; then
            echo "::error::${USERNAME} is already an outside collaborator in ${ORG}."
            exit 1
          fi

          # Add user to the org as an outside collaborator
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG}/outside_collaborators/${USERNAME}"

      - name: Notify issue - completed
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ env.username }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "✅ @${USERNAME} has been added to the organization as an external contributor."
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --reason completed
